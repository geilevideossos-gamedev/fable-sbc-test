# Debian (glibc) base images: onnxruntime / tflite-runtime for the optional in-process
# wake word engine only ship glibc wheels, and the official Wyoming add-ons use Debian too.
build_from:
  aarch64: ghcr.io/home-assistant/aarch64-base-debian:bookworm
  amd64: ghcr.io/home-assistant/amd64-base-debian:bookworm
args:
  # Set to "false" for a smaller image without in-process openWakeWord.
  INSTALL_LOCAL_WAKEWORD: "true"
